name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, typecheck, tests, and evals
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit and integration tests
        run: pnpm test

      - name: Run retrieval evaluation
        run: pnpm eval:retrieval

      - name: Run PTC evaluation
        run: pnpm eval:ptc

      - name: Run dynamic tools evaluation
        run: pnpm eval:tools

      - name: Run context intelligence evaluation
        run: pnpm eval:context

      - name: Run memory intelligence evaluation
        run: pnpm eval:memory

      - name: Run reliability evaluation
        run: pnpm eval:reliability

      - name: Run 10k-turn reliability soak
        run: pnpm eval:soak

      - name: Run multi-agent evaluation
        run: pnpm eval:agents

      - name: Run multi-agent soak
        run: pnpm eval:agents:soak

      - name: Run shared contract and server tests
        run: pnpm test:server

      - name: Run console component tests
        run: pnpm test:console

      - name: Install Chromium for browser smoke tests
        run: pnpm --filter @mnemos/console exec playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: pnpm test:e2e

      - name: Run migration and doctor checks
        env:
          MNEMOS_DB_PATH: ${{ runner.temp }}/mnemos-ci.sqlite
          MNEMOS_ARTIFACT_DIR: ${{ runner.temp }}/mnemos-ci-artifacts
        run: |
          pnpm mnemos migrate
          pnpm mnemos doctor
